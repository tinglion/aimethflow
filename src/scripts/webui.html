<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIMethFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f8f9fa
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: .05em
    }

    #log-box {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: .8rem;
      height: 500px;
      overflow-y: auto;
      padding: .75rem;
      border-radius: 4px;
      white-space: pre-wrap
    }

    .step-row td {
      vertical-align: middle
    }

    .badge-pending {
      background: #6c757d
    }

    .badge-done {
      background: #198754
    }

    .badge-running {
      background: #0d6efd
    }

    .badge-error {
      background: #dc3545
    }

    .badge-skipped {
      background: #adb5bd
    }

    .module-row td {
      background: #eef2f7;
      font-weight: 600;
      font-size: .8rem;
      color: #495057;
      padding: .25rem .5rem;
      border-top: 2px solid #ced4da;
    }

    .step-row td {
      font-size: .85rem;
    }

    .step-key {
      color: #6c757d;
      font-family: monospace;
      font-size: .78rem;
    }

    textarea.toml {
      font-family: monospace;
      font-size: .82rem;
      height: 70vh
    }

    #results-list {
      font-size: .85rem
    }

    .tab-content {
      padding-top: 1rem
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">⚗ AIMethFlow</span>
    <span class="text-secondary small" id="nav-workdir"></span>
  </nav>

  <div class="container-fluid mt-2">
    <ul class="nav nav-tabs" id="tabs">
      <li class="nav-item"><a class="nav-link active" data-tab="pipeline" href="#">Pipeline</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="config" href="#">Config</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="results" href="#">Results</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="report" href="#">Report</a></li>
    </ul>

    <!-- 流程 -->
    <div id="tab-pipeline" class="tab-content">
      <div class="d-flex align-items-center gap-2 mb-2">
        <label class="form-label mb-0 text-nowrap small fw-bold">Working Directory</label>
        <select class="form-select form-select-sm" id="wd-select" style="max-width:400px"
          onchange="loadSteps()"></select>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadWorkdirs()">Refresh</button>
        <label class="form-label mb-0 text-nowrap small fw-bold ms-2">Mode</label>
        <select class="form-select form-select-sm" id="mode-select" style="max-width:120px">
          <option value="plasma">plasma</option>
          <option value="tissue">tissue</option>
        </select>
      </div>
      <div class="row">
        <div class="col-lg-5">
          <table class="table table-sm table-hover">
            <thead>
              <tr>
                <th>Step</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="step-tbody"></tbody>
          </table>
        </div>
        <div class="col-lg-7">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <small class="text-muted" id="log-title">— Log —</small>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-danger d-none" id="kill-btn" onclick="killJob()">&#9632; Stop</button>
              <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">Clear</button>
            </div>
          </div>
          <div id="log-box"></div>
        </div>
      </div>
    </div>

    <!-- 配置 -->
    <div id="tab-config" class="tab-content d-none">
      <div class="d-flex gap-2 mb-2">
        <button class="btn btn-primary btn-sm" onclick="saveConfig()">Save</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadConfig()">Reload</button>
        <span class="text-muted small align-self-center" id="cfg-status"></span>
      </div>
      <textarea class="form-control toml" id="cfg-editor" spellcheck="false"></textarea>
    </div>

    <!-- 结果 -->
    <div id="tab-results" class="tab-content d-none">
      <button class="btn btn-sm btn-outline-secondary mb-2" onclick="loadResults()">Refresh</button>
      <div id="results-list"></div>
    </div>

    <!-- 报告 -->
    <div id="tab-report" class="tab-content d-none">
      <div class="row" style="height:calc(100vh - 120px)">
        <div class="col-lg-3 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="fw-bold">Reports</small>
            <button class="btn btn-sm btn-outline-secondary py-0" onclick="loadReports()">Refresh</button>
          </div>
          <div id="report-list" class="list-group overflow-auto flex-grow-1" style="font-size:.85rem"></div>
        </div>
        <div class="col-lg-9 h-100">
          <iframe id="report-frame" class="w-100 h-100" style="border:none" src="about:blank"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE = '/methapi';
    const STATUS_CLASS = {
      pending: 'badge-pending', done: 'badge-done', running: 'badge-running',
      error: 'badge-error', skipped: 'badge-skipped'
    };
    const STATUS_LABEL = { pending: 'Pending', done: 'Done', running: 'Running', error: 'Failed', skipped: 'Skipped' };
    let currentJob = null;

    // ── tabs ──────────────────────────────────────────────────────────────────────
    document.querySelectorAll('[data-tab]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('[data-tab]').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(x => x.classList.add('d-none'));
        document.getElementById('tab-' + a.dataset.tab).classList.remove('d-none');
        if (a.dataset.tab === 'config') loadConfig();
        if (a.dataset.tab === 'results') loadResults();
        if (a.dataset.tab === 'report') loadReports();
      });
    });

    // ── pipeline ──────────────────────────────────────────────────────────────────
    async function loadWorkdirs() {
      const r = await fetch(`${BASE}/api/workdirs`).then(r => r.json());
      const sel = document.getElementById('wd-select');
      const cur = sel.value;
      sel.innerHTML = r.workdirs.map((d, i) =>
        `<option value="${d}"${d === cur ? ' selected' : ''}>${d}${i === 0 ? ' (latest)' : ''}</option>`
      ).join('') || '<option value="">(no working directories)</option>';
      loadSteps();
    }

    async function loadSteps() {
      const wd = document.getElementById('wd-select').value;
      const url = wd ? `${BASE}/api/steps?workdir=${encodeURIComponent(wd)}` : `${BASE}/api/steps`;
      const r = await fetch(url).then(r => r.json());
      if (r.workdir) document.getElementById('nav-workdir').textContent = r.workdir;
      const tbody = document.getElementById('step-tbody');
      let html = '';
      let lastModule = null;
      for (const s of r.steps) {
        if (s.module && s.module !== lastModule) {
          html += `<tr class="module-row"><td colspan="3">${s.module}</td></tr>`;
          lastModule = s.module;
        }
        const cls = STATUS_CLASS[s.status] || 'badge-pending';
        const lbl = STATUS_LABEL[s.status] || s.status;
        const safeLabel = s.label.replace(/'/g, "\\'");
        html += `<tr class="step-row">
      <td>${s.label} <span class="step-key">[${s.key}]</span></td>
      <td><span class="badge ${cls}">${lbl}</span></td>
      <td><button class="btn btn-sm btn-outline-primary py-0" onclick="runStep('${s.key}','${safeLabel}')">▶</button></td>
    </tr>`;
      }
      tbody.innerHTML = html;
    }

    async function runStep(key, label) {
      if (currentJob && !confirm('A job is already running. Start a new one?')) return;
      document.getElementById('log-title').textContent = `▶ ${label}`;
      document.getElementById('log-box').innerHTML = '';
      const wd = document.getElementById('wd-select').value;
      const mode = document.getElementById('mode-select').value;
      const params = new URLSearchParams();
      if (wd) params.set('workdir', wd);
      params.set('mode', mode);
      const url = `${BASE}/api/run/${key}?${params.toString()}`;
      const r = await fetch(url, { method: 'POST' }).then(r => r.json());
      if (r.job_id) streamLogs(r.job_id);
    }

    function streamLogs(jobId) {
      currentJob = jobId;
      document.getElementById('kill-btn').classList.remove('d-none');
      const logBox = document.getElementById('log-box');
      const es = new EventSource(`${BASE}/api/logs/${jobId}`);
      es.onmessage = e => {
        if (e.data.startsWith('__DONE_')) {
          const rc = parseInt(e.data.replace('__DONE_', ''));
          logBox.innerHTML += `\n[Exit code: ${rc}]\n`;
          es.close(); currentJob = null;
          document.getElementById('kill-btn').classList.add('d-none');
          loadSteps();
          return;
        }
        logBox.innerHTML += escHtml(JSON.parse(e.data)) + '\n';
        logBox.scrollTop = logBox.scrollHeight;
      };
      es.onerror = () => {
        es.close(); currentJob = null;
        document.getElementById('kill-btn').classList.add('d-none');
      };
    }

    async function killJob() {
      if (!currentJob) return;
      await fetch(`${BASE}/api/jobs/${currentJob}/kill`, { method: 'POST' });
      document.getElementById('log-box').innerHTML += '\n[Job stopped by user]\n';
      currentJob = null;
      document.getElementById('kill-btn').classList.add('d-none');
      loadSteps();
    }

    function clearLog() { document.getElementById('log-box').innerHTML = ''; }
    function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // ── config ────────────────────────────────────────────────────────────────────
    async function loadConfig() {
      const r = await fetch(`${BASE}/api/config/raw`).then(r => r.json());
      document.getElementById('cfg-editor').value = r.content;
      document.getElementById('cfg-status').textContent = '';
    }

    async function saveConfig() {
      const content = document.getElementById('cfg-editor').value;
      const resp = await fetch(`${BASE}/api/config/raw`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content }),
      });
      const j = await resp.json();
      const el = document.getElementById('cfg-status');
      if (resp.ok) { el.style.color = 'green'; el.textContent = '✓ Saved'; }
      else { el.style.color = 'red'; el.textContent = '✗ ' + (j.detail || 'Save failed'); }
    }

    // ── results ───────────────────────────────────────────────────────────────────
    async function loadResults() {
      const r = await fetch(`${BASE}/api/results`).then(r => r.json());
      const el = document.getElementById('results-list');
      if (!r.files.length) { el.innerHTML = '<p class="text-muted">No result files</p>'; return; }
      el.innerHTML = '<table class="table table-sm"><thead><tr><th>File</th><th>Size</th></tr></thead><tbody>'
        + r.files.map(f => `<tr><td><code>${f.path}</code></td><td class="text-muted">${f.size_str}</td></tr>`).join('')
        + '</tbody></table>';
    }

    // ── report ────────────────────────────────────────────────────────────────────
    async function loadReports() {
      const r = await fetch(`${BASE}/api/reports`).then(r => r.json());
      const el = document.getElementById('report-list');
      if (!r.reports.length) { el.innerHTML = '<p class="text-muted small px-1">No reports</p>'; return; }
      el.innerHTML = r.reports.map((rep, i) =>
        `<a href="#" class="list-group-item list-group-item-action py-1${i === 0 ? ' active' : ''}"
        data-path="${rep.report_path}"
        onclick="openReport(this);return false">${rep.name}</a>`
      ).join('');
      openReport(el.firstElementChild);
    }

    function openReport(el) {
      document.querySelectorAll('#report-list a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('report-frame').src = '/meth/report-files/' + el.dataset.path;
    }

    // ── init ──────────────────────────────────────────────────────────────────────
    loadWorkdirs();
    setInterval(loadSteps, 8000);
  </script>
</body>

</html>
