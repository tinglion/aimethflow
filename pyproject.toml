[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meth-analysis"
version = "1.0.0"
description = "甲基化分析项目"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "甲基化分析团队"}
]
keywords = ["methylation", "bioinformatics", "sequencing", "DNA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]

dependencies = [
  "biopython>=1.84",
  "matplotlib>=3.8.2",
  "numpy>=1.26.2",
  "toml>=0.10.2",
  "pandas>=2.2.0",
  "seaborn>=0.13.0",
  "scikit-learn>=1.3.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.0.0",
  "pysam>=0.22.0",
  "openpyxl",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[project.scripts]
methylation-extractor = "methylation.methylation_extractor:main"
diff-methylation = "methylation.diff_methylation:main"
methylation-visualizer = "methylation.methylation_visualizer:main"

fq-inspect = "scripts.fq_inspect:main"
fq-dump = "scripts.fq_dump:main"
run-analysis = "scripts.run_analysis:main"
