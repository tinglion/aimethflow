services:
  # ── 全流程分析 ──────────────────────────────────────────────────────────────
  # 用法: docker compose --profile analysis run --rm analysis --steps 1-19
  analysis:
    build: .
    image: meth-analysis:latest
    profiles: ["analysis"]
    volumes:
      - ${DATA_DIR:?请在 .env 中设置 DATA_DIR}:/app/data:ro
      - ${CONFIG_FILE:?请在 .env 中设置 CONFIG_FILE}:/app/config.toml:ro
      - ${TISSUE_DIR:?请在 .env 中设置 TISSUE_DIR}:/mnt/OC_tissue:ro
      - ${PLASMA_DIR:?请在 .env 中设置 PLASMA_DIR}:/mnt/OC_plasma:ro
      - ${REF_DIR:?请在 .env 中设置 REF_DIR}:/mnt/ref:ro
      - ${TEMP_DIR:?请在 .env 中设置 TEMP_DIR}:/mnt/temp
      - ${RESULT_DIR:?请在 .env 中设置 RESULT_DIR}:/mnt/result
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    command: python /app/src/scripts/run_analysis.py

  # ── JupyterLab（分步查看结果）──────────────────────────────────────────────
  # 用法: docker compose --profile jupyter up jupyter
  #       浏览器打开 http://localhost:8888
  jupyter:
    build: .
    image: meth-analysis:latest
    profiles: ["jupyter"]
    ports:
      - "8888:8888"
    volumes:
      - ${DATA_DIR:?请在 .env 中设置 DATA_DIR}:/app/data:ro
      - ${CONFIG_FILE:?请在 .env 中设置 CONFIG_FILE}:/app/config.toml:ro
      - ${TISSUE_DIR:?请在 .env 中设置 TISSUE_DIR}:/mnt/OC_tissue:ro
      - ${PLASMA_DIR:?请在 .env 中设置 PLASMA_DIR}:/mnt/OC_plasma:ro
      - ${REF_DIR:?请在 .env 中设置 REF_DIR}:/mnt/ref:ro
      - ${TEMP_DIR:?请在 .env 中设置 TEMP_DIR}:/mnt/temp
      - ${RESULT_DIR:?请在 .env 中设置 RESULT_DIR}:/mnt/result
      - ${NOTEBOOKS_DIR:-./notebooks}:/app/notebooks
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    command: >
      jupyter lab
        --ip=0.0.0.0
        --no-browser
        --allow-root
        --notebook-dir=/app/notebooks
        --ServerApp.token=''
        --ServerApp.password=''
