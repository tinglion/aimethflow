name: aimethflow

x-analysis-volumes: &analysis-volumes
  volumes:
    # ── 本地配置（改了立即生效）──────────────────────────────────────────────
    - ./config.docker.toml:/app/config.toml  # 编辑此文件调整参数，无需进容器
    # ── 外部数据（宿主机绝对路径，在 .env 中配置）────────────────────────────
    - ${TISSUE_DIR:?请在 .env 中设置 TISSUE_DIR}:/mnt/OC_tissue:ro
    - ${PLASMA_DIR:?请在 .env 中设置 PLASMA_DIR}:/mnt/OC_plasma:ro
    - ${REF_DIR:?请在 .env 中设置 REF_DIR}:/mnt/ref:ro
    - ${DATA_DIR:?请在 .env 中设置 DATA_DIR}:/mnt/data:ro
    - ${TEMP_DIR:?请在 .env 中设置 TEMP_DIR}:/mnt/temp
    - ${RESULT_DIR:?请在 .env 中设置 RESULT_DIR}:/mnt/result
    # ── 受限算法包（pre-publication only；把 aimethflow_core-*.whl 丢进 docs/ 即可）─
    # 详见 DOCKER.md → "Protected core via mounted wheel"
    - ./docs:/docs:ro
  environment:
    - NCBI_API_KEY=${NCBI_API_KEY:-}

services:
  # ── 常驻分析容器（默认启动，内含 Web UI）────────────────────────────────────
  # 构建: docker compose build
  # 启动: docker compose up -d
  # Web UI: http://<host>:9999/meth/
  # 提交任务: 通过 Web UI 或 docker compose exec analysis python /app/src/scripts/run_analysis.py --steps 1-19
  # 进入 shell: docker compose exec analysis bash
  analysis:
    build: .
    image: aimethflow:latest
    <<: *analysis-volumes
    ports:
      - "9999:9999"
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: python /app/src/scripts/webui.py

  # ── 一次性运行（用完即删）────────────────────────────────────────────────────
  # 用法: docker compose --profile run run --rm analysis-run \
  #           python /app/src/scripts/run_analysis.py --steps 1-19
  analysis-run:
    image: aimethflow:latest
    profiles: ["run"]
    <<: *analysis-volumes

  # ── JupyterLab ────────────────────────────────────────────────────────────
  # 启动: docker compose --profile jupyter up -d jupyter
  #       浏览器打开 http://localhost:8888
  jupyter:
    image: aimethflow:latest
    profiles: ["jupyter"]
    ports:
      - "8888:8888"
    volumes:
      - ./config.docker.toml:/app/config.toml
      - ${TISSUE_DIR:?请在 .env 中设置 TISSUE_DIR}:/mnt/OC_tissue:ro
      - ${PLASMA_DIR:?请在 .env 中设置 PLASMA_DIR}:/mnt/OC_plasma:ro
      - ${REF_DIR:?请在 .env 中设置 REF_DIR}:/mnt/ref
      - ${DATA_DIR:?请在 .env 中设置 DATA_DIR}:/mnt/data:ro
      - ${TEMP_DIR:?请在 .env 中设置 TEMP_DIR}:/mnt/temp
      - ${RESULT_DIR:?请在 .env 中设置 RESULT_DIR}:/mnt/result
      - ${NOTEBOOKS_DIR:-./notebooks}:/app/notebooks
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    restart: unless-stopped
    command: >
      jupyter lab
        --ip=0.0.0.0
        --no-browser
        --allow-root
        --notebook-dir=/app/notebooks
        --ServerApp.token=''
        --ServerApp.password=''
