name: aimethflow

x-analysis-volumes: &analysis-volumes
  volumes:
    - ${DATA_DIR:?请在 .env 中设置 DATA_DIR}:/app/data:ro
    - ${CONFIG_FILE:?请在 .env 中设置 CONFIG_FILE}:/app/config.toml:ro
    - ${TISSUE_DIR:?请在 .env 中设置 TISSUE_DIR}:/mnt/OC_tissue:ro
    - ${PLASMA_DIR:?请在 .env 中设置 PLASMA_DIR}:/mnt/OC_plasma:ro
    - ${REF_DIR:?请在 .env 中设置 REF_DIR}:/mnt/ref:ro
    - ${TEMP_DIR:?请在 .env 中设置 TEMP_DIR}:/mnt/temp
    - ${RESULT_DIR:?请在 .env 中设置 RESULT_DIR}:/mnt/result
  environment:
    - NCBI_API_KEY=${NCBI_API_KEY:-}

services:
  # ── 镜像构建基础（无 profile，供 docker compose build 使用）─────────────────
  base:
    build: .
    image: aimethflow:latest

  # ── 常驻分析容器（默认启动，无需指定 profile）──────────────────────────────
  # 启动: docker compose up -d
  # 提交: docker compose exec analysis \
  #           python /app/src/scripts/run_analysis.py --steps 1-19
  # 进入: docker compose exec analysis bash
  analysis:
    image: aimethflow:latest
    <<: *analysis-volumes
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: sleep infinity

  # ── 一次性运行（用完即删）──────────────────────────────────────────────────
  # 用法: docker compose --profile run run --rm analysis-run \
  #           python /app/src/scripts/run_analysis.py --steps 1-19
  analysis-run:
    image: aimethflow:latest
    profiles: ["run"]
    <<: *analysis-volumes

  # ── JupyterLab（分步查看结果）──────────────────────────────────────────────
  # 启动: docker compose --profile jupyter up -d jupyter
  #       浏览器打开 http://localhost:8888
  jupyter:
    image: aimethflow:latest
    profiles: ["jupyter"]
    ports:
      - "8888:8888"
    volumes:
      - ${DATA_DIR:?请在 .env 中设置 DATA_DIR}:/app/data:ro
      - ${CONFIG_FILE:?请在 .env 中设置 CONFIG_FILE}:/app/config.toml:ro
      - ${TISSUE_DIR:?请在 .env 中设置 TISSUE_DIR}:/mnt/OC_tissue:ro
      - ${PLASMA_DIR:?请在 .env 中设置 PLASMA_DIR}:/mnt/OC_plasma:ro
      - ${REF_DIR:?请在 .env 中设置 REF_DIR}:/mnt/ref:ro
      - ${TEMP_DIR:?请在 .env 中设置 TEMP_DIR}:/mnt/temp
      - ${NOTEBOOKS_DIR:-./notebooks}:/app/notebooks
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    restart: unless-stopped
    command: >
      jupyter lab
        --ip=0.0.0.0
        --no-browser
        --allow-root
        --notebook-dir=/app/notebooks
        --ServerApp.token=''
        --ServerApp.password=''
