# 甲基化分析项目配置文件
# 项目名称
name = "甲基化分析项目"
version = "1.0.0"

# 数据目录配置
[data]
# 根数据目录
root_dir = "F:\\meth"
# 组织样本数据目录
tissue_dir = "F:\\meth\\OC_tissue"
# 血浆样本数据目录
plasma_dir = "F:\\meth\\OC_plasma"
# 样本信息Excel文件路径
sample_info_excel = "data/按分期处理_卵巢癌fq编号与样本信息对应表.xlsx"

# 目录配置
[directories]
# 临时文件目录
temp_dir = "temp"
# 结果文件目录
result_dir = "result"
# 日志文件目录
log_dir = "logs"

# FastQ分析配置
[fastq]
# 每处理多少条序列显示进度
progress_interval = 1000000
# 抽样大小
sample_size = 1000
# 随机种子
random_seed = 42

# 甲基化提取配置
[extraction]
# 最小甲基化质量分数
min_quality = 20
# 最小覆盖深度
min_depth = 10
# 参考基因组路径
reference_genome = "/data/meth/bwa/hg38.fa"

# 差异甲基化分析配置
[diff_methylation]
# 甲基化差异阈值
threshold = 0.2
# 统计显著性水平
p_value = 0.05
# 最小覆盖深度
min_depth = 20

# 可视化配置
[visualization]
# 图表类型: density, scatter, heatmap
plot_types = ["density", "scatter", "heatmap"]
# 图表宽度
fig_width = 12
# 图表高度
fig_height = 8
# DPI
dpi = 300
# 字体大小
font_size = 12

# 甲基化数据过滤配置
[filtering]
# 重复序列BED文件路径
repeat_bed = "/mnt/f/meth/hg38.repeat.bed"
# 启动子区域BED文件路径
promoter_bed = "/mnt/f/meth/hg38_upstream_2k_st.bed.gz"
# 最小深度
min_depth = 5
# 最大深度
max_depth = 50

# 日志配置
[logging]
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
# 日志格式
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
# 是否保存到文件
save_to_file = true
# 是否输出到控制台
console_output = true
